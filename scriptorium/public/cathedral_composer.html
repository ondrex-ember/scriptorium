<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jouza Audio Lab: Sacral Cathedral</title>
    <style>
        body {
            background-color: #0d0d12;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            margin-bottom: 10px;
        }
        p {
            color: #888;
            margin-bottom: 30px;
        }
        #visualizer {
            background: #050508;
            border: 1px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.1);
            margin-bottom: 30px;
            width: 800px;
            height: 300px;
        }
        #startBtn {
            background-color: #00ffcc;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #startBtn:hover {
            background-color: #fff;
            box-shadow: 0 0 20px #00ffcc;
        }
        #startBtn:disabled {
            background-color: #333;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <h1>JOUZA LAB v6</h1>
    <p>LEVEL 1: SACRAL CATHEDRAL (9 Generative Instruments + Circle of Fifths)</p>

    <canvas id="visualizer" width="800" height="300"></canvas>
    <button id="startBtn">Iniciovat Opus</button>

    <script>
        let ctx;
        let analyser;
        let destination;

        const getA = () => Math.random();
        const getB = () => 0.5; 
        const getC = () => Math.random();

        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');
        let dataArray;
        let bufferLength;

        function drawSpectrum() {
            requestAnimationFrame(drawSpectrum);
            
            if (!analyser) return;

            analyser.getByteFrequencyData(dataArray);

            canvasCtx.fillStyle = 'rgba(5, 5, 8, 0.2)';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            const barWidth = (canvas.width / bufferLength) * 2.5;
            let barHeight;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                barHeight = dataArray[i];

                const r = barHeight + (25 * (i/bufferLength));
                const g = 250 * (i/bufferLength);
                const b = 255;
                
                canvasCtx.fillStyle = `rgb(${r},${g},${b})`;
                
                const y = canvas.height - (barHeight * 1.2);
                canvasCtx.fillRect(x, y, barWidth, canvas.height - y);

                x += barWidth + 1; 
            }
        }

        canvasCtx.fillStyle = '#050508';
        canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

        // --- JOUZA LAB AUDIO CLASS ---
        class SacralCathedralGenerative {
            constructor() {
                this.master = ctx.createGain(); 
                this.master.gain.value = 0.8;
                this.master.connect(destination); 

                this.reverbBus = ctx.createGain();
                this.reverbBus.gain.value = 1.0;
                
                const revLen = ctx.sampleRate * 4.0; 
                const revBuf = ctx.createBuffer(2, revLen, ctx.sampleRate);
                for (let c = 0; c < 2; c++) {
                    const d = revBuf.getChannelData(c);
                    for (let i = 0; i < revLen; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / revLen, 5.0);
                }
                this.convolver = ctx.createConvolver();
                this.convolver.buffer = revBuf;
                
                this.reverbOutGain = ctx.createGain();
                this.reverbOutGain.gain.value = 1.8; 
                
                this.reverbBus.connect(this.convolver);
                this.convolver.connect(this.reverbOutGain);
                this.reverbOutGain.connect(this.master);

                this.baseFreq = 293.7; 
                this.scaleRatios = [1.0, 1.059, 1.259, 1.335, 1.498, 1.587, 1.888, 1.999, 2.118, 2.519];
                this.circleSteps = [0, 7, 2, 9, 4, 11, 6, 1, 8, 3, 10, 5]; 
                this.currentCircleIndex = 0;
                this.scale = [];
                this.updateScale();
                
                this.motifs = [
                    [0, 1, 2, -1, 3, 2],  
                    [4, -1, 2, 1, 0, -1], 
                    [2, -1, 4, -1, 5, 4],  
                    [0, -1, -1, -1, 2, -1], 
                    [-1, 2, 1, 0, -1, 0]  
                ];
                
                this.currentPhrase = [];
                this.step = 0;    
                this.measure = 0; 
                this.mood = 0.5; 
                this.moodDirection = 0.015; 
            }

            updateScale() {
                let shift = this.circleSteps[this.currentCircleIndex];
                if (shift > 6) shift -= 12; 
                const newRoot = this.baseFreq * Math.pow(2, shift / 12);
                this.scale = this.scaleRatios.map(ratio => newRoot * ratio);
            }

            // 🪕 ZNĚJÍCÍ SITAR
            playSitar(freq) {
                if (!freq) return;
                const t = ctx.currentTime;
                const dur = 3.0 + getC() * 2.0; 
                
                const osc = ctx.createOscillator();
                osc.type = 'sawtooth'; 
                osc.frequency.setValueAtTime(freq * 1.05, t); 
                osc.frequency.exponentialRampToValueAtTime(freq, t + 0.1); 
                
                const subOsc = ctx.createOscillator();
                subOsc.type = 'triangle';
                subOsc.frequency.setValueAtTime((freq / 2) * 1.02, t); 
                subOsc.frequency.exponentialRampToValueAtTime(freq / 2, t + 0.15);

                const symOsc1 = ctx.createOscillator();
                symOsc1.type = 'triangle';
                symOsc1.frequency.value = freq * 1.5; 

                const symOsc2 = ctx.createOscillator();
                symOsc2.type = 'sine';
                symOsc2.frequency.value = freq * 2; 

                const bandpass = ctx.createBiquadFilter(); 
                bandpass.type = 'bandpass'; 
                bandpass.frequency.value = freq * 2 + (getA() * 2); 
                bandpass.Q.value = 3.5; 

                const lowpass = ctx.createBiquadFilter(); 
                lowpass.type = 'lowpass';
                lowpass.frequency.value = freq * 1.2; 

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.25, t + 0.05); 
                gain.gain.exponentialRampToValueAtTime(0.001, t + dur);

                osc.connect(bandpass); 
                symOsc1.connect(bandpass); 
                symOsc2.connect(bandpass);
                subOsc.connect(lowpass); 

                bandpass.connect(gain);
                lowpass.connect(gain);

                const panner = ctx.createPanner();
                panner.panningModel = 'HRTF'; 
                panner.distanceModel = 'inverse';
                
                const orbitSpeed = 0.3; 
                const radius = 4.0; 
                
                const startX = Math.sin(t * orbitSpeed) * radius;
                const startZ = Math.cos(t * orbitSpeed) * radius;
                const endX = Math.sin((t + dur) * orbitSpeed) * radius;
                const endZ = Math.cos((t + dur) * orbitSpeed) * radius;
                
                if (panner.positionX) {
                    panner.positionX.setValueAtTime(startX, t);
                    panner.positionX.linearRampToValueAtTime(endX, t + dur);
                    panner.positionZ.setValueAtTime(startZ, t);
                    panner.positionZ.linearRampToValueAtTime(endZ, t + dur);
                } else {
                    panner.setPosition(startX, 0, startZ); 
                }

                gain.connect(panner); 
                panner.connect(this.master); 
                
                const sendRev = ctx.createGain(); 
                const isMassiveReverb = Math.random() > 0.8;
                sendRev.gain.value = isMassiveReverb ? 2.5 : 0.1;
                
                panner.connect(sendRev); 
                sendRev.connect(this.reverbBus);

                osc.start(t); osc.stop(t + dur);
                subOsc.start(t); subOsc.stop(t + dur);
                symOsc1.start(t); symOsc1.stop(t + dur);
                symOsc2.start(t); symOsc2.stop(t + dur);
            }

            // 👼 ANDĚLSKÝ SOPRÁN (NOVÉ)
            playAngelVoice(freq) {
                if (!freq) return;
                const t = ctx.currentTime;
                const dur = 4.0 + Math.random() * 2.0;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const filter = ctx.createBiquadFilter();

                osc.type = 'sine';
                osc.frequency.value = freq * 2; // Zní o oktávu výš (soprán)

                // Jemné andělské vibrato
                const vibrato = ctx.createOscillator();
                vibrato.frequency.value = 4.5 + Math.random(); // Přirozená nestabilita hlasu
                const vibratoGain = ctx.createGain();
                vibratoGain.gain.value = (freq * 2) * 0.015; // Hloubka vibrata
                vibrato.connect(vibratoGain);
                vibratoGain.connect(osc.frequency);

                filter.type = 'bandpass';
                filter.frequency.value = freq * 2;
                filter.Q.value = 1.5;

                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.12, t + 1.5); 
                gain.gain.exponentialRampToValueAtTime(0.001, t + dur);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.master);
                
                const sendRev = ctx.createGain();
                sendRev.gain.value = 2.0; // Plave v obřím reverbu
                gain.connect(sendRev);
                sendRev.connect(this.reverbBus);

                osc.start(t); vibrato.start(t);
                osc.stop(t + dur); vibrato.stop(t + dur);
            }

            // 🥣 TIBETSKÁ ZPÍVAJÍCÍ MÍSA (NOVÉ)
            playSingingBowl(freq) {
                if (!freq) return;
                const t = ctx.currentTime;
                const dur = 8.0 + Math.random() * 4.0; // Extrémně dlouhý zvuk

                const masterGain = ctx.createGain();
                masterGain.gain.setValueAtTime(0, t);
                masterGain.gain.linearRampToValueAtTime(0.2, t + 2.5); // Velmi pomalý náběh
                masterGain.gain.exponentialRampToValueAtTime(0.001, t + dur);

                // LFO simulující kroužení tloučku (Amplitude modulation)
                const frictionLfo = ctx.createOscillator();
                frictionLfo.type = 'sine';
                frictionLfo.frequency.value = 1.2 + (Math.random() * 0.8); 
                const frictionGain = ctx.createGain();
                frictionGain.gain.value = 0.4;
                frictionLfo.connect(frictionGain);
                
                const amNode = ctx.createGain(); 
                amNode.gain.value = 0.6; // Base volume
                frictionGain.connect(amNode.gain); 

                // 3 mírně rozladěné oscilátory pro "houpání" zvuku (Zázněje)
                [-0.5, 0, 0.4].forEach(detune => {
                    const osc = ctx.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.value = freq + detune;
                    osc.connect(amNode);
                    osc.start(t);
                    osc.stop(t + dur);
                });

                frictionLfo.start(t);
                frictionLfo.stop(t + dur);

                amNode.connect(masterGain);
                masterGain.connect(this.master);
                
                const sendRev = ctx.createGain();
                sendRev.gain.value = 1.5;
                masterGain.connect(sendRev);
                sendRev.connect(this.reverbBus);
            }

            // 🌬️ DŘEVĚNÁ FLÉTNA
            playFlute(freq) {
                if (!freq) return;
                const t = ctx.currentTime;
                const osc = ctx.createOscillator(); 
                const gain = ctx.createGain();
                const filter = ctx.createBiquadFilter();
                
                osc.type = 'sine'; 
                osc.frequency.value = freq; 
                filter.type = 'lowpass'; filter.frequency.value = 600; 
                
                const dur = 3.5 + Math.random(); 
                
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.12, t + 0.8); 
                gain.gain.exponentialRampToValueAtTime(0.001, t + dur); 

                osc.connect(filter); filter.connect(gain); 
                gain.connect(this.reverbBus); gain.connect(this.master);
                osc.start(t); osc.stop(t + dur);
            }

            // 🔔 CHRÁMOVÝ ZVON
            playBell(freq) {
                if (!freq) return;
                const t = ctx.currentTime;
                const overtones = [1, 2.76, 5.4, 8.9, 11.3];
                
                overtones.forEach((mult, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    const physMod = ctx.createOscillator();
                    const physModGain = ctx.createGain();
                    physMod.type = 'sine';
                    physMod.frequency.value = freq * 0.5; 
                    physModGain.gain.setValueAtTime(freq * 0.1, t); 
                    physModGain.gain.exponentialRampToValueAtTime(0.01, t + 0.5); 
                    
                    osc.type = 'sine';
                    osc.frequency.value = freq * mult;
                    
                    physMod.connect(physModGain);
                    physModGain.connect(osc.frequency); 

                    const dur = 6.0 / (i + 1); 
                    
                    gain.gain.setValueAtTime(0, t);
                    gain.gain.linearRampToValueAtTime(0.4 / (i + 1), t + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
                    
                    osc.connect(gain);
                    gain.connect(this.master);
                    
                    const sendRev = ctx.createGain(); sendRev.gain.value = 1.0;
                    gain.connect(sendRev); sendRev.connect(this.reverbBus);
                    
                    osc.start(t); physMod.start(t);
                    osc.stop(t + dur); physMod.stop(t + dur);
                });
            }

            // 🎹 PÍŠŤALOVÉ VARHANY
            playOrgan(freq) {
                if (!freq) return;
                const t = ctx.currentTime;
                const dur = 4.0 + getC() * 2; 
                
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.12, t + 0.8); 
                gain.gain.setValueAtTime(0.12, t + dur - 1.5);
                gain.gain.linearRampToValueAtTime(0.001, t + dur);

                [0.5, 1, 2].forEach(mult => {
                    const osc = ctx.createOscillator();
                    osc.type = mult === 1 ? 'square' : 'sine';
                    osc.frequency.value = freq * mult;
                    
                    const airPressureMod = ctx.createOscillator();
                    const airPressureGain = ctx.createGain();
                    airPressureMod.frequency.value = 4 + (Math.random() * 2); 
                    airPressureGain.gain.value = 3; 
                    
                    airPressureMod.connect(airPressureGain);
                    airPressureGain.connect(osc.frequency);
                    
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass'; filter.frequency.value = 1200;
                    
                    osc.connect(filter); filter.connect(gain);
                    osc.start(t); airPressureMod.start(t);
                    osc.stop(t + dur); airPressureMod.stop(t + dur);
                });
                
                gain.connect(this.master);
                const sendRev = ctx.createGain(); sendRev.gain.value = 0.8;
                gain.connect(sendRev); sendRev.connect(this.reverbBus);
            }

            // 🗣️ MNIŠSKÝ CHORÁL
            playChant(freq) {
                if (!freq) return;
                const t = ctx.currentTime;
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                const f1 = ctx.createBiquadFilter(); const f2 = ctx.createBiquadFilter();
                
                osc.type = 'sawtooth'; osc.frequency.value = freq / 2; 
                f1.type = 'bandpass'; f1.frequency.value = 600; f1.Q.value = 4; 
                f2.type = 'bandpass'; f2.frequency.value = 1100; f2.Q.value = 5;
                
                osc.connect(f1); f1.connect(gain); osc.connect(f2); f2.connect(gain);

                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.15, t + 1.0);
                gain.gain.linearRampToValueAtTime(0, t + 3.0);
                
                gain.connect(this.master); gain.connect(this.reverbBus); 
                osc.start(t); osc.stop(t + 3.0);
            }

            // 👻 CREEPY CHOIR
            playCreepyChoir(freq) {
                if (!freq) return;
                const t = ctx.currentTime;
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                const filter = ctx.createBiquadFilter();

                osc.type = 'triangle'; osc.frequency.value = freq;
                filter.type = 'lowpass'; filter.frequency.value = 250 + getC() * 300; 
                
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.12, t + 2.0); 
                gain.gain.linearRampToValueAtTime(0, t + 5.0);   

                osc.connect(filter); filter.connect(gain); 
                gain.connect(this.master); gain.connect(this.reverbBus);
                osc.start(t); osc.stop(t + 5.0);
            }

            manageDrone() {
                if (!this.droneOsc) {
                    this.droneOsc = ctx.createOscillator(); 
                    this.droneOsc2 = ctx.createOscillator();
                    this.droneGain = ctx.createGain(); 
                    this.droneFilter = ctx.createBiquadFilter();

                    this.droneOsc.type = 'sine'; 
                    this.droneOsc2.type = 'triangle'; 

                    this.droneFilter.type = 'lowpass'; 
                    this.droneGain.gain.value = 0; 
                    
                    const osc1Gain = ctx.createGain(); osc1Gain.gain.value = 1.0;
                    const osc2Gain = ctx.createGain(); osc2Gain.gain.value = 0.20;

                    this.droneOsc.connect(osc1Gain); osc1Gain.connect(this.droneFilter);
                    this.droneOsc2.connect(osc2Gain); osc2Gain.connect(this.droneFilter);
                    
                    this.droneFilter.connect(this.droneGain); 
                    
                    this.droneGain.connect(this.master);
                    const sendRev = ctx.createGain(); sendRev.gain.value = 0.4;
                    this.droneGain.connect(sendRev); sendRev.connect(this.reverbBus);
                    
                    this.droneOsc.start(); this.droneOsc2.start();
                }
                
                const currentRoot = this.scale[0] / 8; 
                this.droneOsc.frequency.linearRampToValueAtTime(currentRoot, ctx.currentTime + 4);
                this.droneOsc2.frequency.linearRampToValueAtTime(currentRoot * 2, ctx.currentTime + 4);

                const targetVol = this.mood > 0.4 ? (this.mood * 0.25) : 0.05;
                this.droneGain.gain.linearRampToValueAtTime(targetVol, ctx.currentTime + 2);
                
                const physicalTension = Math.sin(ctx.currentTime * 0.5) * 20; 
                this.droneFilter.frequency.linearRampToValueAtTime(60 + (this.mood * 80) + getA() + physicalTension, ctx.currentTime + 2); 
            }

            start() {
                this.manageDrone();

                setInterval(() => {
                    if (this.step === 0) {
                        this.mood += this.moodDirection;
                        if (this.mood > 1.0 || this.mood < 0.0) {
                            this.moodDirection *= -1; 
                            this.mood += this.moodDirection;
                        }

                        if (this.measure > 0 && this.measure % 16 === 0) {
                            this.currentCircleIndex = (this.currentCircleIndex + 1) % this.circleSteps.length;
                            this.updateScale();
                        }

                        let baseMotif = this.motifs[Math.floor(Math.random() * this.motifs.length)];
                        let transposition = Math.random() < 0.3 ? 2 : 0; 
                        if (this.measure % 4 === 0) transposition = 0; 
                        
                        this.currentPhrase = baseMotif.map(index => {
                            if (index === -1) return null; 
                            let newIndex = index + transposition;
                            if (newIndex >= this.scale.length) newIndex = this.scale.length - 1;
                            return this.scale[newIndex];
                        });

                        this.manageDrone(); 
                        this.measure++;
                    }

                    const note = this.currentPhrase[this.step];
                    
                    if (note) {
                        // ÚPRAVA LOGIKY PRO NOVÉ NÁSTROJE
                        if (this.mood < 0.4) {
                            if (Math.random() > 0.3) this.playSitar(note);
                            if (Math.random() > 0.85) this.playBell(note); 
                            if ((this.step === 0 || this.step === 3) && Math.random() > 0.85) this.playFlute(note); 
                            // Nástup andělského hlasu ve světlé fázi
                            if (Math.random() > 0.75) this.playAngelVoice(note); 
                        } 
                        else if (this.mood >= 0.4 && this.mood < 0.7) {
                            if (Math.random() > 0.25) this.playChant(note); 
                            if (Math.random() > 0.8) this.playOrgan(note); 
                            // Mystická tibetská mísa v přechodech
                            if (Math.random() > 0.6) this.playSingingBowl(note); 
                        } 
                        else {
                            if (Math.random() > 0.15) this.playCreepyChoir(note); 
                            if (Math.random() > 0.75) this.playOrgan(note / 2); 
                            if (Math.random() > 0.8) this.playBell(note / 2); 
                            // Temná hluboká rezonance mísy v temné fázi
                            if (Math.random() > 0.85) this.playSingingBowl(note / 2); 
                        }
                    }

                    this.step = (this.step + 1) % 6;
                    
                }, 400 - (getB() * 150)); 
            }
        }

        const startBtn = document.getElementById('startBtn');

        startBtn.addEventListener('click', () => {
            startBtn.textContent = 'Běží generování...';
            startBtn.disabled = true;

            const AudioContext = window.AudioContext || window.webkitAudioContext;
            ctx = new AudioContext();

            analyser = ctx.createAnalyser();
            analyser.fftSize = 1024; 
            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);

            destination = analyser;
            analyser.connect(ctx.destination);

            drawSpectrum();

            const app = new SacralCathedralGenerative();
            app.start();
        });

    </script>
</body>
</html>
