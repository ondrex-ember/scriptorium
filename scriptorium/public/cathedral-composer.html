<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jouza Audio Lab: Sacral Cathedral</title>
    <style>
        body {
            background-color: #0d0d12;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            margin-bottom: 10px;
        }
        p {
            color: #888;
            margin-bottom: 30px;
        }
        #visualizer {
            background: #050508;
            border: 1px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.1);
            margin-bottom: 30px;
            width: 800px;
            height: 300px;
        }
        #startBtn {
            background-color: #00ffcc;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #startBtn:hover {
            background-color: #fff;
            box-shadow: 0 0 20px #00ffcc;
        }
        #startBtn:disabled {
            background-color: #333;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
        }
        #matrix-wrap {
            width: 800px;
            margin-top: 24px;
            position: relative;
        }
        #matrix-header {
            display: grid;
            grid-template-columns: 60px 70px 130px 80px 130px 1fr;
            font-size: 0.65rem;
            color: #00ffcc;
            letter-spacing: 2px;
            border-bottom: 1px solid #0f3f30;
            padding: 0 14px 6px 14px;
            margin-bottom: 0;
            text-transform: uppercase;
            opacity: 0.6;
        }
        #matrix-log {
            background: #02080a;
            border: 1px solid #0a2a20;
            border-top: none;
            height: 180px;
            overflow: hidden;
            position: relative;
            font-size: 0.72rem;
            letter-spacing: 1.5px;
            line-height: 1.7;
            padding: 10px 14px;
            box-sizing: border-box;
            text-align: left;
        }
        #matrix-log::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 40px;
            background: linear-gradient(to bottom, #02080a, transparent);
            pointer-events: none;
        }
        .log-line {
            display: grid;
            grid-template-columns: 60px 70px 130px 80px 130px 1fr;
            gap: 0;
            opacity: 0;
            animation: fadeIn 0.15s ease forwards;
            white-space: nowrap;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        .log-time  { color: #1a4a38; }
        .log-ms    { color: #0a6644; }
        .log-inst  { font-weight: bold; }
        .log-freq  { color: #00aa88; }
        .log-mood  { }
        .log-note  { color: #336655; font-size: 0.65rem; }

        .inst-SITAR       { color: #00ffcc; }
        .inst-BELL        { color: #aaffee; }
        .inst-FLUTE       { color: #55ffdd; }
        .inst-ANGEL       { color: #ccffff; }
        .inst-CHANT       { color: #ffcc44; }
        .inst-ORGAN       { color: #ff9944; }
        .inst-BOWL        { color: #44ddff; }
        .inst-CHOIR       { color: #ff4488; }
        .inst-DRONE       { color: #334455; }

        .mood-bar {
            display: inline-block;
            height: 8px;
            background: currentColor;
            vertical-align: middle;
            margin-right: 4px;
            border-radius: 1px;
        }
        .mood-low    { color: #00aacc; }
        .mood-mid    { color: #aacc00; }
        .mood-high   { color: #ff4455; }

        #status-bar {
            display: flex;
            justify-content: space-between;
            border: 1px solid #0a2a20;
            border-top: 1px solid #0f3f30;
            padding: 6px 14px;
            font-size: 0.62rem;
            color: #1a6644;
            letter-spacing: 1.5px;
            background: #010608;
        }
        #status-bar span { color: #00ffcc; }
    </style>
</head>
<body>

    <h1>JOUZA LAB v6</h1>
    <p>LEVEL 1: SACRAL CATHEDRAL (Native Dark IR & Gentle Glue) · FIXED</p>

    <canvas id="visualizer" width="800" height="300"></canvas>
    <button id="startBtn">Iniciovat Opus</button>

    <div id="matrix-wrap">
        <div id="matrix-header">
            <span>TIMESTAMP</span>
            <span>CTX·MS</span>
            <span>INSTRUMENT</span>
            <span>FREQ</span>
            <span>MOOD</span>
            <span>NOTE·INFO</span>
        </div>
        <div id="matrix-log"></div>
        <div id="status-bar">
            MEASURE <span id="s-measure">—</span> &nbsp;|&nbsp;
            SCALE ROOT <span id="s-root">—</span> Hz &nbsp;|&nbsp;
            CIRCLE IDX <span id="s-circle">—</span> &nbsp;|&nbsp;
            STEP <span id="s-step">—</span>/6 &nbsp;|&nbsp;
            NODES FIRED <span id="s-nodes">0</span>
        </div>
    </div>

    <script>
        let ctx;
        let analyser;
        let destination;

        const getA = () => Math.random();
        const getB = () => Math.random();
        const getC = () => Math.random();

        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');
        let dataArray;
        let bufferLength;

        // ── MATRIX LOGGER ──────────────────────────────────────────
        const matrixLog  = document.getElementById('matrix-log');
        const sMeasure   = document.getElementById('s-measure');
        const sRoot      = document.getElementById('s-root');
        const sCircle    = document.getElementById('s-circle');
        const sStep      = document.getElementById('s-step');
        const sNodes     = document.getElementById('s-nodes');
        let totalNodes   = 0;
        const MAX_LINES  = 60;

        function moodLabel(m) {
            if (m < 0.4)  return { cls: 'mood-low',  label: 'SERENE' };
            if (m < 0.7)  return { cls: 'mood-mid',  label: 'TENSION' };
            return               { cls: 'mood-high', label: 'ABYSS' };
        }

        function matrixPush(instrument, freq, mood, extra = '') {
            totalNodes++;
            sNodes.textContent = totalNodes;

            const now  = new Date();
            const ts   = `${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
            const ms   = ctx ? ctx.currentTime.toFixed(2) : '0.00';
            const mBar = Math.round(mood * 16);
            const { cls, label } = moodLabel(mood);

            const line = document.createElement('div');
            line.className = 'log-line';
            line.innerHTML =
                `<span class="log-time">${ts}</span>` +
                `<span class="log-ms">${ms}s</span>` +
                `<span class="log-inst inst-${instrument}">${instrument}</span>` +
                `<span class="log-freq">${freq ? freq.toFixed(1)+'Hz' : '——'}</span>` +
                `<span class="log-mood ${cls}"><span class="mood-bar" style="width:${mBar * 4}px"></span>${label}</span>` +
                `<span class="log-note">${extra}</span>`;

            matrixLog.appendChild(line);

            // Scrolluj dolů, ořež staré řádky
            matrixLog.scrollTop = matrixLog.scrollHeight;
            const lines = matrixLog.querySelectorAll('.log-line');
            if (lines.length > MAX_LINES) lines[0].remove();
        }
        // ────────────────────────────────────────────────────────────

        function drawSpectrum() {
            requestAnimationFrame(drawSpectrum);
            if (!analyser) return;

            analyser.getByteFrequencyData(dataArray);

            canvasCtx.fillStyle = 'rgba(5, 5, 8, 0.2)';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            const barWidth = (canvas.width / bufferLength) * 2.5;
            let barHeight;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                barHeight = dataArray[i];
                const r = barHeight + (25 * (i/bufferLength));
                const g = 250 * (i/bufferLength);
                const b = 255;
                
                canvasCtx.fillStyle = `rgb(${r},${g},${b})`;
                const y = canvas.height - (barHeight * 1.2);
                canvasCtx.fillRect(x, y, barWidth, canvas.height - y);
                x += barWidth + 1; 
            }
        }

        canvasCtx.fillStyle = '#050508';
        canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

        class SacralCathedralGenerative {
            constructor() {
                this.master = ctx.createGain(); 
                this.master.gain.value = 0.45; // sníženo z 0.8 — hlavní headroom fix

                // Glue kompresor — stejné hodnoty, ale teď má prostor pracovat
                this.compressor = ctx.createDynamicsCompressor();
                this.compressor.threshold.value = -12; // sníženo z -6, dřívější zásah
                this.compressor.knee.value = 10;
                this.compressor.ratio.value = 6;        // mírně zvýšeno pro jistotu
                this.compressor.attack.value = 0.005;   // rychlejší — stíhá transients
                this.compressor.release.value = 0.15;

                // TRUE LIMITER na úplném konci chain — tvrdý strop, nulový knee
                this.limiter = ctx.createDynamicsCompressor();
                this.limiter.threshold.value = -1.0;  // téměř 0 dBFS
                this.limiter.knee.value = 0;          // hard knee = opravdový limiter
                this.limiter.ratio.value = 20;        // 20:1 = efektivně nekonečno
                this.limiter.attack.value = 0.001;    // 1ms — zachytí každý spike
                this.limiter.release.value = 0.05;

                this.masterTapeFilter = ctx.createBiquadFilter();
                this.masterTapeFilter.type = 'lowpass';
                this.masterTapeFilter.frequency.value = 14000;

                // Chain: master → compressor → tapeFilter → limiter → output
                this.master.connect(this.compressor);
                this.compressor.connect(this.masterTapeFilter);
                this.masterTapeFilter.connect(this.limiter);
                this.limiter.connect(destination); 

                this.reverbBus = ctx.createGain();
                this.reverbBus.gain.value = 1.0;
                
                const revLen = ctx.sampleRate * 4.0; 
                const revBuf = ctx.createBuffer(2, revLen, ctx.sampleRate);
                const dL = revBuf.getChannelData(0);
                const dR = revBuf.getChannelData(1);
                
                let lastL = 0, lastR = 0;
                for (let i = 0; i < revLen; i++) {
                    let noiseL = (Math.random() * 2 - 1);
                    let noiseR = (Math.random() * 2 - 1);
                    lastL = lastL + 0.15 * (noiseL - lastL);
                    lastR = lastR + 0.15 * (noiseR - lastR);
                    let envelope = Math.pow(1 - i / revLen, 5.0);
                    dL[i] = lastL * envelope;
                    dR[i] = lastR * envelope;
                }

                this.convolver = ctx.createConvolver();
                this.convolver.buffer = revBuf;
                
                this.reverbOutGain = ctx.createGain();
                this.reverbOutGain.gain.value = 0.7; // bylo 1.8 — reverb přetěžoval master bus
                
                this.reverbBus.connect(this.convolver);
                this.convolver.connect(this.reverbOutGain);
                this.reverbOutGain.connect(this.master);

                this.baseFreq = 293.7; 
                this.scaleRatios = [1.0, 1.059, 1.259, 1.335, 1.498, 1.587, 1.888, 1.999, 2.118, 2.519];
                this.circleSteps = [0, 7, 2, 9, 4, 11, 6, 1, 8, 3, 10, 5]; 
                this.currentCircleIndex = 0;
                this.scale = [];
                this.updateScale();
                
                this.motifs = [
                    [0, 1, 2, -1, 3, 2],  
                    [4, -1, 2, 1, 0, -1], 
                    [2, -1, 4, -1, 5, 4],  
                    [0, -1, -1, -1, 2, -1], 
                    [-1, 2, 1, 0, -1, 0]  
                ];
                
                this.currentPhrase = [];
                this.step = 0;    
                this.measure = 0; 
                this.mood = 0.5; 
                this.moodDirection = 0.008 + Math.random() * 0.02; // variabilní rychlost
            }

            updateScale() {
                let shift = this.circleSteps[this.currentCircleIndex];
                if (shift > 6) shift -= 12; 
                const newRoot = this.baseFreq * Math.pow(2, shift / 12);
                this.scale = this.scaleRatios.map(ratio => newRoot * ratio);
            }

            playSitar(freq) {
                if (!freq) return;
                matrixPush('SITAR', freq, this.mood, `Q:1.2 dur:${(3.0+getC()*2).toFixed(1)}s`);
                const t = ctx.currentTime;
                const dur = 3.0 + getC() * 2.0; 
                
                // FIX 1: Sawtooth → triangle pro základ = okamžité odebrání agresivních harmonických
                // Sawtooth má všechny harmonické (1/n), triangle má jen liché a rychle klesají (1/n²)
                const osc = ctx.createOscillator();
                osc.type = 'triangle'; // bylo: 'sawtooth'
                osc.frequency.setValueAtTime(freq * 1.05, t); 
                osc.frequency.exponentialRampToValueAtTime(freq, t + 0.1); 
                
                const subOsc = ctx.createOscillator();
                subOsc.type = 'triangle';
                subOsc.frequency.setValueAtTime((freq / 2) * 1.02, t); 
                subOsc.frequency.exponentialRampToValueAtTime(freq / 2, t + 0.15);

                const symOsc1 = ctx.createOscillator();
                symOsc1.type = 'sine'; // bylo: 'triangle' – odebráno zdvojování středů
                symOsc1.frequency.value = freq * 1.5; 

                const symOsc2 = ctx.createOscillator();
                symOsc2.type = 'sine';
                symOsc2.frequency.value = freq * 2; 

                // FIX 2: Bandpass Q sníženo z 2.8 → 1.2 a frequency posunuta výš
                // Q 2.8 způsobovalo rezonanci = ten škrábavý zvuk uprostřed spektra
                const bandpass = ctx.createBiquadFilter(); 
                bandpass.type = 'bandpass';
                bandpass.frequency.value = freq * 3.5; // bylo: freq * 2 + random – příliš nízko
                bandpass.Q.value = 1.2;                // bylo: 2.8 – rezonovalo

                // FIX 3: Přidán pre-lowpass před bandpass pro ořez hrubých harmonických
                const preLowpass = ctx.createBiquadFilter();
                preLowpass.type = 'lowpass';
                preLowpass.frequency.value = freq * 4;
                preLowpass.Q.value = 0.5; // Butterworth-like, bez rezonance

                const lowpass = ctx.createBiquadFilter(); 
                lowpass.type = 'lowpass';
                lowpass.frequency.value = freq * 1.2; 

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.18, t + 0.02); // mírně sníženo z 0.25
                gain.gain.exponentialRampToValueAtTime(0.001, t + dur - 0.1);
                gain.gain.linearRampToValueAtTime(0, t + dur);

                // Signal chain: osc → preLowpass → bandpass → gain
                osc.connect(preLowpass);
                preLowpass.connect(bandpass);
                symOsc1.connect(bandpass);
                symOsc2.connect(bandpass);
                subOsc.connect(lowpass); 
                bandpass.connect(gain);
                lowpass.connect(gain);

                const panner = ctx.createPanner();
                panner.panningModel = 'HRTF';
                panner.distanceModel = 'inverse';
                const orbitSpeed = 0.3;
                const radius = 4.0; 
                
                const startX = Math.sin(t * orbitSpeed) * radius;
                const startZ = Math.cos(t * orbitSpeed) * radius;
                const endX = Math.sin((t + dur) * orbitSpeed) * radius;
                const endZ = Math.cos((t + dur) * orbitSpeed) * radius;
                
                if (panner.positionX) {
                    panner.positionX.setValueAtTime(startX, t);
                    panner.positionX.linearRampToValueAtTime(endX, t + dur);
                    panner.positionZ.setValueAtTime(startZ, t);
                    panner.positionZ.linearRampToValueAtTime(endZ, t + dur);
                } else {
                    panner.setPosition(startX, 0, startZ); 
                }

                gain.connect(panner);
                panner.connect(this.master); 
                
                // FIX 4: Reverb send spike odstraněn – konstantní nízká hodnota
                // Původní: Math.random() > 0.8 ? 2.5 : 0.1 → náhodné skoky na 2.5 způsobovaly přehlušení
                const sendRev = ctx.createGain(); 
                sendRev.gain.value = 0.15; // bylo: random spike 2.5 nebo 0.1
                panner.connect(sendRev);
                sendRev.connect(this.reverbBus);

                const stopTime = t + dur + 0.05;
                osc.start(t); osc.stop(stopTime);
                subOsc.start(t); subOsc.stop(stopTime);
                symOsc1.start(t); symOsc1.stop(stopTime);
                symOsc2.start(t); symOsc2.stop(stopTime);
            }

            playAngelVoice(freq) {
                if (!freq) return;
                matrixPush('ANGEL', freq, this.mood, 'vibrato·sine');
                const t = ctx.currentTime; const dur = 4.0 + Math.random() * 2.0;

                const osc = ctx.createOscillator(); const gain = ctx.createGain(); const filter = ctx.createBiquadFilter();
                osc.type = 'sine'; osc.frequency.value = freq * 2; 

                const vibrato = ctx.createOscillator(); vibrato.frequency.value = 4.5 + Math.random(); 
                const vibratoGain = ctx.createGain(); vibratoGain.gain.value = (freq * 2) * 0.015; 
                vibrato.connect(vibratoGain); vibratoGain.connect(osc.frequency);

                filter.type = 'bandpass'; filter.frequency.value = freq * 2; filter.Q.value = 1.5;

                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.12, t + 1.5); 
                gain.gain.exponentialRampToValueAtTime(0.001, t + dur - 0.1);
                gain.gain.linearRampToValueAtTime(0, t + dur);

                osc.connect(filter); filter.connect(gain); gain.connect(this.master);
                
                const sendRev = ctx.createGain(); sendRev.gain.value = 2.0; 
                gain.connect(sendRev); sendRev.connect(this.reverbBus);

                osc.start(t); vibrato.start(t);
                osc.stop(t + dur + 0.05); vibrato.stop(t + dur + 0.05);
            }

            playSingingBowl(freq) {
                if (!freq) return;
                matrixPush('BOWL', freq, this.mood, 'AM·friction');
                const t = ctx.currentTime; const dur = 8.0 + Math.random() * 4.0;

                const masterGain = ctx.createGain();
                masterGain.gain.setValueAtTime(0, t);
                masterGain.gain.linearRampToValueAtTime(0.2, t + 2.5); 
                masterGain.gain.exponentialRampToValueAtTime(0.001, t + dur - 0.1);
                masterGain.gain.linearRampToValueAtTime(0, t + dur);

                const frictionLfo = ctx.createOscillator(); frictionLfo.type = 'sine'; frictionLfo.frequency.value = 1.2 + (Math.random() * 0.8); 
                const frictionGain = ctx.createGain(); frictionGain.gain.value = 0.4; frictionLfo.connect(frictionGain);
                
                const amNode = ctx.createGain(); amNode.gain.value = 0.6; frictionGain.connect(amNode.gain); 

                [-0.5, 0, 0.4].forEach(detune => {
                    const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = freq + detune;
                    osc.connect(amNode); osc.start(t); osc.stop(t + dur + 0.05);
                });

                frictionLfo.start(t); frictionLfo.stop(t + dur + 0.05);

                amNode.connect(masterGain); masterGain.connect(this.master);
                
                const sendRev = ctx.createGain(); sendRev.gain.value = 1.5;
                masterGain.connect(sendRev); sendRev.connect(this.reverbBus);
            }

            playFlute(freq) {
                if (!freq) return;
                matrixPush('FLUTE', freq, this.mood, 'lp:600Hz');
                const t = ctx.currentTime;
                const osc = ctx.createOscillator(); const gain = ctx.createGain(); const filter = ctx.createBiquadFilter();
                
                osc.type = 'sine'; osc.frequency.value = freq; filter.type = 'lowpass'; filter.frequency.value = 600; 
                const dur = 3.5 + Math.random(); 
                
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.12, t + 0.8); 
                gain.gain.exponentialRampToValueAtTime(0.001, t + dur - 0.1); 
                gain.gain.linearRampToValueAtTime(0, t + dur); 

                osc.connect(filter); filter.connect(gain); gain.connect(this.reverbBus); gain.connect(this.master);
                osc.start(t); osc.stop(t + dur + 0.05);
            }

            playBell(freq) {
                if (!freq) return;
                matrixPush('BELL', freq, this.mood, '5×overtone·physmod');
                const t = ctx.currentTime;
                const overtones = [1, 2.76, 5.4, 8.9, 11.3];
                
                overtones.forEach((mult, i) => {
                    const osc = ctx.createOscillator(); const gain = ctx.createGain();
                    const physMod = ctx.createOscillator(); const physModGain = ctx.createGain();
                    
                    physMod.type = 'sine'; physMod.frequency.value = freq * 0.5; 
                    physModGain.gain.setValueAtTime(freq * 0.1, t); physModGain.gain.exponentialRampToValueAtTime(0.01, t + 0.5); 
                    
                    osc.type = 'sine'; osc.frequency.value = freq * mult;
                    physMod.connect(physModGain); physModGain.connect(osc.frequency); 

                    const dur = 6.0 / (i + 1); 
                    
                    gain.gain.setValueAtTime(0, t);
                    gain.gain.linearRampToValueAtTime(0.4 / (i + 1), t + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + dur - 0.1);
                    gain.gain.linearRampToValueAtTime(0, t + dur);
                    
                    osc.connect(gain); gain.connect(this.master);
                    const sendRev = ctx.createGain(); sendRev.gain.value = 1.0; gain.connect(sendRev); sendRev.connect(this.reverbBus);
                    
                    osc.start(t); physMod.start(t);
                    osc.stop(t + dur + 0.05); physMod.stop(t + dur + 0.05);
                });
            }

            playOrgan(freq) {
                if (!freq) return;
                matrixPush('ORGAN', freq, this.mood, 'sq+2×sine·airmod');
                const t = ctx.currentTime; const dur = 4.0 + getC() * 2; 
                
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.12, t + 0.8); 
                gain.gain.setValueAtTime(0.12, t + dur - 1.5);
                gain.gain.linearRampToValueAtTime(0, t + dur);

                [0.5, 1, 2].forEach(mult => {
                    const osc = ctx.createOscillator(); osc.type = mult === 1 ? 'square' : 'sine'; osc.frequency.value = freq * mult;
                    
                    const airPressureMod = ctx.createOscillator(); const airPressureGain = ctx.createGain();
                    airPressureMod.frequency.value = 4 + (Math.random() * 2); airPressureGain.gain.value = 3; 
                    
                    airPressureMod.connect(airPressureGain); airPressureGain.connect(osc.frequency);
                    
                    const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 1200;
                    
                    osc.connect(filter); filter.connect(gain);
                    osc.start(t); airPressureMod.start(t);
                    osc.stop(t + dur + 0.05); airPressureMod.stop(t + dur + 0.05);
                });
                
                gain.connect(this.master);
                const sendRev = ctx.createGain(); sendRev.gain.value = 0.8; gain.connect(sendRev); sendRev.connect(this.reverbBus);
            }

            playChant(freq) {
                if (!freq) return;
                matrixPush('CHANT', freq, this.mood, 'bp:600+1100Hz');
                const t = ctx.currentTime;
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                const f1 = ctx.createBiquadFilter(); const f2 = ctx.createBiquadFilter();
                
                osc.type = 'sawtooth'; osc.frequency.value = freq / 2; 
                f1.type = 'bandpass'; f1.frequency.value = 600; f1.Q.value = 4; 
                f2.type = 'bandpass'; f2.frequency.value = 1100; f2.Q.value = 5;
                
                osc.connect(f1); f1.connect(gain); osc.connect(f2); f2.connect(gain);

                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.15, t + 1.0);
                gain.gain.linearRampToValueAtTime(0, t + 3.0);
                
                gain.connect(this.master);
                // FIX: chant reverb přes gain node, ne přímo — zabraňuje nekontrolovanému feedu
                const chantRev = ctx.createGain(); chantRev.gain.value = 0.3;
                gain.connect(chantRev); chantRev.connect(this.reverbBus);
                osc.start(t); osc.stop(t + 3.05);
            }

            playCreepyChoir(freq) {
                if (!freq) return;
                matrixPush('CHOIR', freq, this.mood, `lp:${(250+getC()*300).toFixed(0)}Hz·tri`);
                const t = ctx.currentTime;
                const osc = ctx.createOscillator(); const gain = ctx.createGain(); const filter = ctx.createBiquadFilter();

                osc.type = 'triangle'; osc.frequency.value = freq;
                filter.type = 'lowpass'; filter.frequency.value = 250 + getC() * 300; 
                
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.07, t + 2.0); // bylo 0.12
                gain.gain.linearRampToValueAtTime(0, t + 5.0);   

                osc.connect(filter); filter.connect(gain); gain.connect(this.master); gain.connect(this.reverbBus);
                osc.start(t); osc.stop(t + 5.05);
            }

            manageDrone() {
                if (!this.droneOsc) {
                    this.droneOsc = ctx.createOscillator(); this.droneOsc2 = ctx.createOscillator();
                    this.droneGain = ctx.createGain(); this.droneFilter = ctx.createBiquadFilter();

                    this.droneOsc.type = 'sine'; this.droneOsc2.type = 'triangle'; 
                    this.droneFilter.type = 'lowpass'; this.droneGain.gain.value = 0; 
                    
                    const osc1Gain = ctx.createGain(); osc1Gain.gain.value = 1.0;
                    const osc2Gain = ctx.createGain(); osc2Gain.gain.value = 0.20;

                    this.droneOsc.connect(osc1Gain); osc1Gain.connect(this.droneFilter);
                    this.droneOsc2.connect(osc2Gain); osc2Gain.connect(this.droneFilter);
                    
                    this.droneFilter.connect(this.droneGain); 
                    this.droneGain.connect(this.master);
                    
                    const sendRev = ctx.createGain(); sendRev.gain.value = 0.4;
                    this.droneGain.connect(sendRev); sendRev.connect(this.reverbBus);
                    
                    this.droneOsc.start(); this.droneOsc2.start();
                }
                
                const currentRoot = this.scale[0] / 8; 
                this.droneOsc.frequency.setTargetAtTime(currentRoot, ctx.currentTime, 1.0);
                this.droneOsc2.frequency.setTargetAtTime(currentRoot * 2, ctx.currentTime, 1.0);

                const targetVol = this.mood > 0.4 ? (this.mood * 0.25) : 0.05;
                this.droneGain.gain.setTargetAtTime(targetVol, ctx.currentTime, 0.5);
                
                const physicalTension = Math.sin(ctx.currentTime * 0.5) * 20; 
                this.droneFilter.frequency.setTargetAtTime(60 + (this.mood * 80) + getA() + physicalTension, ctx.currentTime, 0.5); 
            }

            start() {
                this.manageDrone();

                // FIX 5: setInterval → AudioContext-aware scheduling
                // setInterval trpí JS event loop jitterem (±50ms), 
                // scheduleNext rekurzivně plánuje přesně přes setTimeout + AudioContext clock
                const scheduleNext = () => {
                    if (this.step === 0) {
                        this.mood += this.moodDirection;
                        if (this.mood > 1.0 || this.mood < 0.0) {
                            this.moodDirection *= -1; this.mood += this.moodDirection;
                        }

                        if (this.measure > 0 && this.measure % 16 === 0) {
                            this.currentCircleIndex = (this.currentCircleIndex + 1) % this.circleSteps.length;
                            this.updateScale();
                            // Randomizuj směr i rychlost — zabraňuje uvíznutí na ABYSS
                            this.moodDirection = (0.008 + Math.random() * 0.018) * (Math.random() > 0.5 ? 1 : -1);
                        }

                        let baseMotif = this.motifs[Math.floor(Math.random() * this.motifs.length)];
                        let transposition = Math.random() < 0.3 ? 2 : 0; 
                        if (this.measure % 4 === 0) transposition = 0; 
                        
                        this.currentPhrase = baseMotif.map(index => {
                            if (index === -1) return null; 
                            let newIndex = index + transposition;
                            if (newIndex >= this.scale.length) newIndex = this.scale.length - 1;
                            return this.scale[newIndex];
                        });

                        this.manageDrone();
                        matrixPush('DRONE', this.scale[0] / 8, this.mood, `root/8·filter`);
                        this.measure++;

                        // Status bar
                        sMeasure.textContent = this.measure;
                        sRoot.textContent    = this.scale[0].toFixed(1);
                        sCircle.textContent  = this.currentCircleIndex;
                        sStep.textContent    = this.step;
                    }

                    const note = this.currentPhrase[this.step];
                    
                    if (note) {
                        if (this.mood < 0.4) {
                            if (Math.random() > 0.3) this.playSitar(note);
                            if (Math.random() > 0.85) this.playBell(note); 
                            if ((this.step === 0 || this.step === 3) && Math.random() > 0.85) this.playFlute(note); 
                            if (Math.random() > 0.75) this.playAngelVoice(note); 
                        } 
                        else if (this.mood >= 0.4 && this.mood < 0.7) {
                            if (Math.random() > 0.25) this.playChant(note); 
                            if (Math.random() > 0.8) this.playOrgan(note); 
                            if (Math.random() > 0.6) this.playSingingBowl(note); 
                        } 
                        else {
                            if (Math.random() > 0.45) this.playCreepyChoir(note);  // bylo 0.15
                            if (Math.random() > 0.55) this.playOrgan(note / 2);    // bylo 0.75
                            if (Math.random() > 0.5)  this.playBell(note / 2);     // bylo 0.8
                            if (Math.random() > 0.6)  this.playSingingBowl(note / 2); // bylo 0.85
                            if (Math.random() > 0.7)  this.playAngelVoice(note);   // nový — přidán i do ABYSS
                        }
                    }
                    this.step = (this.step + 1) % 6;
                    sStep.textContent = this.step;

                    // Variabilní interval – původně bylo getB() vždy 0.5
                    const interval = 400 - (getB() * 150);
                    setTimeout(scheduleNext, interval);
                };

                scheduleNext();
            }
        }

        const startBtn = document.getElementById('startBtn');

        startBtn.addEventListener('click', () => {
            startBtn.textContent = 'Běží generování...';
            startBtn.disabled = true;

            const AudioContext = window.AudioContext || window.webkitAudioContext;
            ctx = new AudioContext();

            analyser = ctx.createAnalyser();
            analyser.fftSize = 1024; 
            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);

            destination = analyser;
            analyser.connect(ctx.destination);

            drawSpectrum();

            const app = new SacralCathedralGenerative();
            app.start();
        });

    </script>
</body>
